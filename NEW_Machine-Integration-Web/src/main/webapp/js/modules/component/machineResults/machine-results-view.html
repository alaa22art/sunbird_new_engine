<md-content layout-padding class="machine-assign-tests-wrapper">
    <form name="machineResults" novalidate ng-submit="" flex>

        <div flex="50">
            <lov form="machineResults" ng-if="machineLookup!=null" options="machineLookup" select="machineLookup.selectedValue"></lov>
        </div>


        <md-toolbar>
            <div class="md-toolbar-tools">
                <div layout="row" flex>
                    <md-button aria-label="{{'resend' | translate}}" class="md-fab md-mini" ng-click="resendLabResults()" type="button">
                        <md-tooltip md-direction="top">{{'resend' | translate}}</md-tooltip>
                        <md-icon md-font-icon="fa fa-plus"></md-icon>
                    </md-button>
                </div>
                <div layout="row">
                    <md-button aria-label="{{ 'refresh' | translate}}" class="md-fab md-mini" http-disable-click ng-click="refreshGrid()" type="button">
                        <md-tooltip md-direction="top">{{'refresh' | translate}}</md-tooltip>
                        <md-icon md-font-icon="fa fa-refresh"></md-icon>
                    </md-button>
                </div>
            </div>
        </md-toolbar>
        <div kendo-grid="machineResultsGrid" id="machineResultsGrid" class="k-widget k-grid" options="MachineResultGridOptions"></div>

    </form>
</md-content>
