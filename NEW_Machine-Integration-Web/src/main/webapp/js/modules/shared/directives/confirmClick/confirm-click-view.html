<md-dialog>
    <md-dialog-content>
        <div class="md-dialog-content">
            {{message | translate}}
        </div>
    </md-dialog-content>
    <md-dialog-actions layout="row">
        <md-button ng-click="cancel()">
            {{'cancel' | translate}}
        </md-button>
        <md-button ng-click="ok()" http-disable-click md-autofocus>
            {{'ok' | translate}}
        </md-button>
    </md-dialog-actions>
</md-dialog>
